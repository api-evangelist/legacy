aid: legacy
name: Legacy
description: 'Legacy is a United States direct-to-consumer male fertility company offering
  at-home sperm testing and sperm cryopreservation without a clinic visit. Customers order
  a collection kit online, provide a sample at home, and return it by free overnight shipping
  to Legacy''s CLIA-certified, CLEP-approved laboratory, where results appear in a private
  client dashboard within 48 hours of receipt. Services span basic, standard, and advanced
  semen analysis (count, concentration, motility, morphology, and Halosperm sperm DNA
  fragmentation), STI testing, multi-year sperm storage bundles, and male fertility
  supplements. Legacy serves people trying to conceive and those preserving fertility ahead
  of a vasectomy, testosterone therapy, gender-affirming care, cancer treatment, or military
  deployment, and is in-network with selected insurers and employer fertility benefit
  programs. Legacy publishes no public developer API; its notable machine-readable surface is
  a first-party llms.txt written for AI answer engines.'
